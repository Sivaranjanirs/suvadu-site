<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're on the list — Suvadu</title>
<meta name="robots" content="noindex">
<style>
  :root{ --ink:#191922; --muted:#63636f; --bg:#ffffff; --bg2:#f4f4fb;
    --accent:#584bf1; --accent2:#8573ff; --line:#e7e7f1; }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#ececf3; --muted:#a0a0af; --bg:#0c0c11; --bg2:#12121a;
      --accent:#8b82fa; --accent2:#b3a3ff; --line:#24242f; } }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
    font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .card{ max-width:480px; text-align:center; padding:40px 26px; }
  .logo{ width:56px; height:56px; border-radius:15px; margin:0 auto 22px;
    background:linear-gradient(160deg,var(--accent2),var(--accent)); display:grid; place-items:center; }
  .logo svg{ width:34px; height:34px; }
  .check{ color:var(--accent); font-size:15px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; }
  h1{ font-size:32px; letter-spacing:-0.02em; margin:8px 0 12px; }
  p{ color:var(--muted); margin:0 0 8px; }
  a.btn{ display:inline-block; margin-top:24px; color:var(--accent); font-weight:700; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 3.2c-2.4.3-4 2-4 4.1 0 .5.1 1 .3 1.4-.9.6-1.5 1.6-1.5 2.8 0 1.1.5 2 1.3 2.6-.1.3-.1.6-.1.9 0 1.9 1.6 3.4 3.7 3.4.9 0 1.7-.3 2.3-.8V4.6c-.6-.9-1.5-1.5-2-1.4Z" fill="#fff"/><path d="M15 3.2c2.4.3 4 2 4 4.1 0 .5-.1 1-.3 1.4.9.6 1.5 1.6 1.5 2.8 0 1.1-.5 2-1.3 2.6.1.3.1.6.1.9 0 1.9-1.6 3.4-3.7 3.4-.9 0-1.7-.3-2.3-.8V4.6c.6-.9 1.5-1.5 2-1.4Z" fill="#fff" opacity=".85"/></svg>
    </div>
    <div class="check">You're on the list</div>
    <h1>Thanks — we'll be in touch.</h1>
    <p>We’ve got your details. As spots open in the private beta, we’ll email you a TestFlight invite.</p>
    <p>Keep an eye on your inbox (and spam folder, just in case).</p>
    <a class="btn" href="/">← Back to Suvadu</a>
  </div>
</body>
</html>
